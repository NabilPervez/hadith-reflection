<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Hadith Reflection</title>
    <meta name="description" content="Read the major Hadith collections one narration at a time, in Arabic and English, and keep a private reflection journal that never leaves your device." />
    <meta name="theme-color" content="#FAFAF8" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:title" content="Hadith Reflection" />
    <meta property="og:description" content="Read hadith one narration at a time and keep a private reflection journal." />
    <meta property="og:image" content="https://hadith-reflection.netlify.app/icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap"
    />
    <script>
      // Set the theme before first paint so dark-mode users don't get a white flash.
      try {
        var s = JSON.parse(localStorage.getItem("hadith_settings") || "{}");
        var t = s.theme && s.theme !== "system" ? s.theme : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Hadith Reflection needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
