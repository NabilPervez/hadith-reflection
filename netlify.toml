[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# Android (Trusted Web Activity)
#
# Chrome only hides the address bar when it can fetch this file as JSON and
# find the app's signing-key fingerprint in it.
# ---------------------------------------------------------------------------

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"

# Netlify serves .webmanifest as application/octet-stream by default, which
# Bubblewrap and some installers reject.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# The service worker must never be cached, or an update can't reach
# installed copies of the app.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Hashed build assets never change, so cache them for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# ---------------------------------------------------------------------------
# Routing: Netlify serves an existing file before a non-forced rewrite, so
# this only answers paths with no file behind them (e.g. /?view=journal deep
# links, or a stale bookmark) with the app shell instead of a 404.
# ---------------------------------------------------------------------------

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
